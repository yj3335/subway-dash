services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: subway_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=srvr,ruok"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/2181' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: subway_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: subway_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      set -e
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic gtfs-vehicle --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic gtfs-trips   --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic gtfs-alerts  --partitions 2  --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic gtfs-dlq     --partitions 2  --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather-feed --partitions 1  --replication-factor 1 --config cleanup.policy=compact
      echo 'Topics created. Listing:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    restart: "no"

  spark-master:
    image: apache/spark:3.5.0
    container_name: subway_spark_master
    user: root
    command: ["/opt/spark/sbin/start-master.sh"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - spark_checkpoints:/checkpoints
      - spark_staging:/data/staging
      - ../data:/data/raw:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 >/dev/null 2>&1 || curl -fsS http://localhost:8080 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10

  spark-worker:
    image: apache/spark:3.5.0
    container_name: subway_spark_worker
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
    volumes:
      - spark_checkpoints:/checkpoints
      - spark_staging:/data/staging
      - ../data:/data/raw:ro

  mongo:
    image: mongo:6
    container_name: subway_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10

  cassandra:
    image: cassandra:4.1
    container_name: subway_cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=subway_dash
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 15

volumes:
  mongo_data:
  cassandra_data:
  kafka_data:
  spark_checkpoints:
  spark_staging:
